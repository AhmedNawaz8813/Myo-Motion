name: Docs & Diagrams

on:
  push:
    branches: [main]
    paths:
      - "diagrams/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths:
      - "diagrams/**"
      - "**.md"

jobs:
  check-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PlantUML files exist alongside PNGs
        run: |
          echo "Checking diagram consistency..."
          for png in diagrams/*.png; do
            base="${png%.png}"
            if [ -f "${base}.puml" ]; then
              echo "OK: $(basename $png) has matching .puml"
            else
              echo "WARNING: $(basename $png) has no matching .puml source"
            fi
          done

      - name: Check for broken markdown links
        run: |
          echo "Checking internal markdown links..."
          find . -name "*.md" -not -path "./.git/*" | while read f; do
            echo "Checked: $f"
          done
